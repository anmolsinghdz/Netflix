spring.application.name=content-service

server.port=8081

# ===============================
# MySQL Datasource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/content_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect (Spring Boot 3+ usually auto-detects)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=content-service-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust packages for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages="*"

# Optional: If producer adds type headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Optional: Default target type
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

management.endpoints.web.exposure.include=health, info